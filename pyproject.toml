[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloudspatial-emissions-etl"
version = "0.1.0"
description = "Cloud-native geospatial ETL pipeline for satellite emissions monitoring using AWS S3, PostGIS, and GeoParquet."
readme = "README.md"
authors = [
    { name = "Mustapha ATTOU", email = "attou.mustapha.pro@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=14.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "moto[s3]>=4.2.0",
    "ruff>=0.1.0"
]

[project.scripts]
emissions-etl = "emissions_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
